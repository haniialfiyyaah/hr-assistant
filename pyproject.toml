[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: requires a running API and live OpenAI credentials"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Vercel FastAPI project (repo root). UI uses a separate project with Root Directory = web.
[tool.vercel]
entrypoint = "src.main:app"
