[project]
name = "hr-assistant"
version = "1.0.0"
description = "HR Policy and Leave Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "openai>=1.68,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "redis>=5.2,<7",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

# Application, not an installable package. Vercel runs `uv lock` against this table.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: requires a running API and live OpenAI credentials"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Vercel api service entry. The Next.js service is the web root in vercel.json.
[tool.vercel]
entrypoint = "src.main:app"
